name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.ko.md"
      - "README.en.md"
  pull_request:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.ko.md"
      - "README.en.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-only-acceptance:
    name: Node-only acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: node:24.15.0-bookworm-slim
    env:
      LOCAL_LLM_RUNTIME_PROVIDER: node-llama-cpp
      LOCAL_LLM_DEVICE: none
      LOCAL_LLM_GPU_LAYERS: "0"
      LOCAL_LLM_MAX_TOKENS: "32"
      REQUEST_TIMEOUT: "120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject Python runtime reintroduction
        shell: bash
        run: |
          set -euo pipefail

          python_runtime_files="$(
            find . \
              -path ./.git -prune -o \
              -path ./node_modules -prune -o \
              \( \
                -path './python/*' -o \
                -name '*.py' -o \
                -name 'pyproject.toml' -o \
                -name 'requirements*.txt' -o \
                -name 'Pipfile' -o \
                -name 'Pipfile.lock' -o \
                -name 'poetry.lock' -o \
                -name '.python-version' \
              \) \
              -print || true
          )"

          if [[ -n "$python_runtime_files" ]]; then
            echo "Python runtime files are not allowed in the Node-only acceptance gate:"
            echo "$python_runtime_files"
            exit 1
          fi

          if grep -R "actions/setup-python" .github/workflows \
               --exclude="ci.yml" >/dev/null 2>&1; then
            echo "actions/setup-python is not allowed in CI workflows."
            exit 1
          fi

      - name: Install build tools for native modules
        shell: bash
        run: apt-get update -qq && apt-get install -y --no-install-recommends python3 make g++

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify Role 1 with node-llama-cpp
        run: npm run verify:role1 -- --runtime-provider node-llama-cpp

  test-typescript:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, build, and tests in parallel
        shell: bash
        env:
          LOCAL_LLM_AUTO_START: "0"
        run: |
          set -euo pipefail

          pids=()

          npm run typecheck &
          pids+=($!)

          npm run build &
          pids+=($!)

          npx vitest run --passWithNoTests &
          pids+=($!)

          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done

          exit "$status"
