name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.ko.md"
      - "README.en.md"
  pull_request:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.ko.md"
      - "README.en.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-typescript:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, build, and tests in parallel
        shell: bash
        env:
          LOCAL_LLM_AUTO_START: "0"
        run: |
          set -euo pipefail

          pids=()

          npm run typecheck &
          pids+=($!)

          npm run build &
          pids+=($!)

          npx vitest run --passWithNoTests &
          pids+=($!)

          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done

          exit "$status"
