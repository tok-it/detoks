[project]
name = "detoks-role1"
version = "0.1.0"
description = "Python support modules for the detoks Kompress worker."
requires-python = "==3.13.*"
dependencies = [
  "headroom-ai[ml]==0.13.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.1",
  "ruff==0.15.9",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["llama_server*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
files = ["python/llama_server"]
mypy_path = ["python"]
strict = true
